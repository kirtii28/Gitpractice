<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="../CSS/mystyle.css"> -->

    <style>
        h1
        {
            color: brown;
        }

        ol 
        {
            background-color: cornflowerblue;
            border: 1px  solid yellow;
            width: 50%;
            border-radius: 30px;
            /* padding: 20px; */
            /* text-align: center; */
            list-style-position: inside;
            list-style-type: decimal-leading-zero;

        }
        li
        {
            background-color: burlywood;
            border: 2px solid ;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }

         ul
        {
            background-color: violet;
            border: 1px  solid yellow;
            width: 50%;
            border-radius: 30px;
            /* padding: 20px; */
            /* text-align: center; */
            list-style-position: inside;
           list-style-image: url(../Images/arrow2.png);

        }
    </style>
</head>
<body>

    <!-- Ordered List -->
     <h1>Ordered List</h1>
     <ol  >
      <li>Sufiyan</li>
      <li>Siddhesh</li>
      <li>Danish</li>
      <li>Aryan</li>
      <li>Suhana</li>
     </ol>


     <h1>Unordered List</h1>
     <ul >
      <li>Sufiyan</li>
      <li>Siddhesh</li>
      <li>Danish</li>
      <li>Aryan</li>
      <li>Suhana</li>
     </ol>
    
</body>
</html>
