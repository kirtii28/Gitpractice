<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1
        {
            color: brown;
        }

        ol
        {
             background-color: antiquewhite;
              list-style: inside lower-alpha;

        }
        ul
        {
            background-color: antiquewhite;
              list-style: inside ;
            list-style-image: url(../Images/arrow.png);

        }

        li
        {
            background-color: darkcyan;
            margin: 15px;
            padding: 10px;


        }


    </style>



</head>
<body>
    <h1>Ordered List</h1>

    <ol  >
        <li>Sahil</li>
        <li>Aeraf</li>
        <li>Kajal</li>
        <li>Fawaz</li>
        <li>Nayaf</li>
        <li>Pran</li>
    </ol>


    <h1>Unordered List</h1>
    <ul style="list-style-type: circle;">
        <li>Sahil</li>
        <li>Aeraf</li>
        <li>Kajal</li>
        <li>Fawaz</li>
        <li>Nayaf</li>
        <li>Pran</li>
    </ul>


   



</body>
</html>
