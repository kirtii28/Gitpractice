<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        ul 
        {
            width: 50%;
            background-color: antiquewhite;
            /* margin: 10px; */
            /* padding: -10px; */
            border: 2px solid palevioletred;
            list-style-position: inside;
        }

        .l1
        {
            width: 70%;
            background-color: orange;
            margin: 10px;
            padding: 10px;
            /* list-style-image: url(../Images/bullet.png); */
        }
    </style>
</head>
<body>

    <h1>Types of list in html</h1>

    <h2>1.Ordered List of students </h2>
    <ol type="">
        <li>Jay</li>
        <li>Sam</li>
        <li>Tanmay</li>
        <li>Diksha</li>
        <li>Kajal</li>
    </ol>

    <h2>2.Unordered List of students </h2>
    <ul>
         <li class="l1">Jay</li>
        <li class="l1">Sam</li>
        <li class="l1">Tanmay</li>
        <li class="l1">Diksha</li>
        <li class="l1">Kajal</li>
    </ul>


        <h2>3.defination List of students </h2>

    <dl>
        <dt>HTML</dt>
        <dd>Hyper text Markup language</dd>


        <dt>CSS</dt>
        <dd>Cascading style sheet</dd>
    </dl>

    
</body>
</html>
